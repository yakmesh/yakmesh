name: Discord Release Notification

on:
  release:
    types: [published]
  # Also trigger on version tags for npm publishes
  push:
    tags:
      - 'v*'

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Get release info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "url=${{ github.event.release.html_url }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "url=https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
          
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          VERSION="${{ steps.release_info.outputs.version }}"
          URL="${{ steps.release_info.outputs.url }}"
          
          # Create the embed JSON
          cat > payload.json << 'EOF'
          {
            "username": "YakBot",
            "avatar_url": "https://raw.githubusercontent.com/yakmesh/yakmesh/main/assets/yakmesh-logo2.png",
            "embeds": [{
              "title": "🦬 YAKMESH™ ${VERSION} Released!",
              "description": "A new version of YAKMESH has been published!\n\n**Install:**\n```bash\nnpm install yakmesh@${VERSION}\n```",
              "url": "${URL}",
              "color": 1292035,
              "fields": [
                {
                  "name": "📦 npm",
                  "value": "[View on npm](https://npmjs.com/package/yakmesh)",
                  "inline": true
                },
                {
                  "name": "📖 GitHub",
                  "value": "[View Release](${URL})",
                  "inline": true
                },
                {
                  "name": "📚 Docs",
                  "value": "[Documentation](https://yakmesh.dev/docs)",
                  "inline": true
                }
              ],
              "footer": {
                "text": "YAKMESH™ - Sturdy & Secure",
                "icon_url": "https://raw.githubusercontent.com/yakmesh/yakmesh/main/assets/yakmesh-logo2.png"
              },
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
            }]
          }
          EOF
          
          # Replace variables in payload
          sed -i "s|\${VERSION}|$VERSION|g" payload.json
          sed -i "s|\${URL}|$URL|g" payload.json
          
          # Send to Discord
          curl -H "Content-Type: application/json" \
               -d @payload.json \
               "$DISCORD_WEBHOOK"
               
          echo "✓ Discord notification sent for $VERSION"
