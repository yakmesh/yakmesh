<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" opacity="0.04">
  <!-- Quick Reference - Clipboard with checklist and search lens -->
  <!-- Clipboard board -->
  <rect x="110" y="60" width="180" height="300" rx="10" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <!-- Clipboard clip -->
  <rect x="170" y="45" width="60" height="30" rx="5" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="200" cy="50" r="5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Checklist items -->
  <rect x="140" y="100" width="14" height="14" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M143 107 L146 110 L152 103" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="165" y1="107" x2="255" y2="107" stroke="#f59e0b" stroke-width="1"/>
  <rect x="140" y="135" width="14" height="14" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M143 142 L146 145 L152 138" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="165" y1="142" x2="245" y2="142" stroke="#f59e0b" stroke-width="1"/>
  <rect x="140" y="170" width="14" height="14" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M143 177 L146 180 L152 173" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="165" y1="177" x2="250" y2="177" stroke="#f59e0b" stroke-width="1"/>
  <rect x="140" y="205" width="14" height="14" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="165" y1="212" x2="240" y2="212" stroke="#f59e0b" stroke-width="1"/>
  <rect x="140" y="240" width="14" height="14" rx="2" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="165" y1="247" x2="235" y2="247" stroke="#f59e0b" stroke-width="1"/>
  <!-- Table grid at bottom -->
  <rect x="140" y="280" width="120" height="50" fill="none" stroke="#f59e0b" stroke-width="1"/>
  <line x1="200" y1="280" x2="200" y2="330" stroke="#f59e0b" stroke-width="1"/>
  <line x1="140" y1="305" x2="260" y2="305" stroke="#f59e0b" stroke-width="1"/>
  <!-- Search magnifying glass (top right) -->
  <circle cx="330" cy="90" r="20" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <line x1="344" y1="104" x2="360" y2="120" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- Mountain base -->
  <path d="M30 395 L70 360 L110 395" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <path d="M290 395 L330 360 L370 395" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
</svg>
