  <rect x="120" y="400" width="210" height="60" rx="3" fill="#1a2a22" opacity="0.7"/>
  <rect x="120" y="400" width="210" height="60" rx="3" stroke="#2e4c43" stroke-width="1" fill="none" opacity="0.3"/>
  <circle cx="140" cy="430" r="5" fill="#5a9a7a" opacity="0.6"/>
  <circle cx="160" cy="430" r="5" fill="#4a8a6a" opacity="0.5"/>
