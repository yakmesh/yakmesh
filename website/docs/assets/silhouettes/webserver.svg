  <text x="960" y="510" fill="#4a8a6a" opacity="0.5" font-size="24" font-family="monospace" text-anchor="middle">YAKMESH</text>
  <text x="960" y="540" fill="#3d6a5a" opacity="0.4" font-size="16" font-family="monospace" text-anchor="middle">WEB</text>
  
  <!-- RIGHT SIDE - Client devices -->
  <line x1="1160" y1="350" x2="1450" y2="280" stroke="#3d6a5a" stroke-width="2" opacity="0.4"/>
  <line x1="1160" y1="430" x2="1500" y2="400" stroke="#3d6a5a" stroke-width="2" opacity="0.4"/>
  <line x1="1160" y1="520" x2="1550" y2="520" stroke="#4a8a6a" stroke-width="3" opacity="0.5"/>
  <line x1="1160" y1="610" x2="1500" y2="640" stroke="#3d6a5a" stroke-width="2" opacity="0.4"/>
  <line x1="1160" y1="690" x2="1450" y2="760" stroke="#3d6a5a" stroke-width="2" opacity="0.4"/>
  
  <!-- Desktop client -->
  <rect x="1480" y="240" width="100" height="80" rx="5" fill="#1a2a22" opacity="0.7"/>
  <rect x="1480" y="240" width="100" height="80" rx="5" stroke="#2e4c43" stroke-width="2" fill="none" opacity="0.4"/>
  <rect x="1490" y="250" width="80" height="50" fill="#2e4c43" opacity="0.3"/>
  <rect x="1510" y="320" width="40" height="8" fill="#2e4c43" opacity="0.4"/>
  
  <!-- Laptop client -->
  <rect x="1540" y="380" width="90" height="60" rx="5" fill="#1a2a22" opacity="0.7"/>
  <rect x="1540" y="380" width="90" height="60" rx="5" stroke="#2e4c43" stroke-width="2" fill="none" opacity="0.4"/>
  <polygon points="1530,440 1640,440 1650,460 1520,460" fill="#1a2a22" opacity="0.7"/>
  
