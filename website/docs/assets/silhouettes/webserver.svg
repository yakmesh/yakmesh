  <rect x="1580" y="480" width="50" height="80" rx="8" fill="#1a2a22" opacity="0.7"/>
  <rect x="1580" y="480" width="50" height="80" rx="8" stroke="#2e4c43" stroke-width="2" fill="none" opacity="0.4"/>
  <rect x="1588" y="490" width="34" height="55" fill="#2e4c43" opacity="0.3"/>
  
  <!-- Tablet client -->
  <rect x="1540" y="620" width="80" height="60" rx="5" fill="#1a2a22" opacity="0.7"/>
  <rect x="1540" y="620" width="80" height="60" rx="5" stroke="#2e4c43" stroke-width="2" fill="none" opacity="0.4"/>
  <rect x="1548" y="628" width="64" height="44" fill="#2e4c43" opacity="0.3"/>
  
  <!-- Terminal client -->
  <rect x="1480" y="740" width="100" height="60" rx="5" fill="#1a2a22" opacity="0.7"/>
  <rect x="1480" y="740" width="100" height="60" rx="5" stroke="#2e4c43" stroke-width="2" fill="none" opacity="0.4"/>
  <text x="1530" y="775" fill="#4a8a6a" opacity="0.4" font-size="10" font-family="monospace" text-anchor="middle">&gt;_</text>
  
  <!-- Data flow on main line -->
  <circle cx="1250" cy="520" r="5" fill="#5a9a7a" opacity="0.5"/>
  <circle cx="1350" cy="520" r="5" fill="#5a9a7a" opacity="0.5"/>
  <circle cx="1450" cy="520" r="5" fill="#5a9a7a" opacity="0.5"/>
  
  <!-- Ground -->
