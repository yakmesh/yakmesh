  <circle cx="1040" cy="420" r="8" fill="#4a8a6a" opacity="0.6"/>
  <circle cx="860" cy="540" r="8" fill="#5a9a7a" opacity="0.6"/>
  <circle cx="1060" cy="580" r="8" fill="#4a8a6a" opacity="0.6"/>
  <circle cx="950" cy="640" r="8" fill="#4a8a6a" opacity="0.6"/>
  
