<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="yakappGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0c1a22" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0e2a3a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#134e6f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="chatGlow" cx="50%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c1a22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base gradient -->
  <rect width="1920" height="1080" fill="url(#yakappGrad)"/>

  <!-- Subtle glow behind center -->
  <rect width="1920" height="1080" fill="url(#chatGlow)"/>

  <!-- Mountains silhouette -->
  <path d="M0 850 L180 580 L350 720 L550 480 L780 660 L960 400 L1140 620 L1370 500 L1550 680 L1750 520 L1920 650 L1920 1080 L0 1080 Z" fill="#0a1318" opacity="0.9"/>

  <!-- Central yak silhouette (chat mascot) -->
  <g transform="translate(860, 350)">
    <!-- Yak body -->
    <ellipse cx="100" cy="120" rx="110" ry="70" fill="#0e2a3a" opacity="0.8"/>
    <!-- Yak head -->
    <ellipse cx="-10" cy="80" rx="50" ry="40" fill="#0e2a3a" opacity="0.8"/>
    <!-- Horns -->
    <path d="M-40 60 Q-70 20 -50 0" stroke="#134e6f" stroke-width="6" fill="none" opacity="0.6"/>
    <path d="M10 55 Q30 15 60 5" stroke="#134e6f" stroke-width="6" fill="none" opacity="0.6"/>
    <!-- Legs -->
    <line x1="30" y1="185" x2="30" y2="240" stroke="#0e2a3a" stroke-width="12" opacity="0.7"/>
    <line x1="80" y1="185" x2="80" y2="245" stroke="#0e2a3a" stroke-width="12" opacity="0.7"/>
    <line x1="140" y1="185" x2="140" y2="242" stroke="#0e2a3a" stroke-width="12" opacity="0.7"/>
    <line x1="180" y1="180" x2="180" y2="238" stroke="#0e2a3a" stroke-width="12" opacity="0.7"/>
    <!-- Tail -->
    <path d="M210 100 Q250 60 240 120" stroke="#0e2a3a" stroke-width="8" fill="none" opacity="0.7"/>
  </g>

  <!-- Chat bubble left -->
  <g transform="translate(400, 500)">
    <rect x="0" y="0" width="220" height="80" rx="20" fill="#0e2a3a" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
    <polygon points="180,80 200,110 160,80" fill="#0e2a3a" opacity="0.5"/>
    <!-- Text lines -->
    <line x1="25" y1="28" x2="140" y2="28" stroke="#22d3ee" stroke-width="3" opacity="0.25"/>
    <line x1="25" y1="45" x2="180" y2="45" stroke="#22d3ee" stroke-width="3" opacity="0.2"/>
    <line x1="25" y1="62" x2="110" y2="62" stroke="#22d3ee" stroke-width="3" opacity="0.15"/>
  </g>

  <!-- Chat bubble right -->
  <g transform="translate(1250, 480)">
    <rect x="0" y="0" width="250" height="90" rx="20" fill="#0e2a3a" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
    <polygon points="40,90 20,120 60,90" fill="#0e2a3a" opacity="0.5"/>
    <!-- Text lines -->
    <line x1="25" y1="30" x2="200" y2="30" stroke="#22d3ee" stroke-width="3" opacity="0.25"/>
    <line x1="25" y1="48" x2="160" y2="48" stroke="#22d3ee" stroke-width="3" opacity="0.2"/>
    <line x1="25" y1="66" x2="210" y2="66" stroke="#22d3ee" stroke-width="3" opacity="0.15"/>
  </g>

  <!-- Smaller bubbles floating -->
  <circle cx="680" cy="420" r="15" fill="#22d3ee" opacity="0.08"/>
  <circle cx="700" cy="450" r="10" fill="#22d3ee" opacity="0.06"/>
  <circle cx="1200" cy="440" r="12" fill="#22d3ee" opacity="0.07"/>
  <circle cx="1220" cy="470" r="8" fill="#22d3ee" opacity="0.05"/>

  <!-- Mesh connection lines between bubbles -->
  <line x1="620" y1="540" x2="960" y2="470" stroke="#22d3ee" stroke-width="1" opacity="0.08"/>
  <line x1="960" y1="470" x2="1250" y2="520" stroke="#22d3ee" stroke-width="1" opacity="0.08"/>
  <line x1="620" y1="540" x2="1250" y2="520" stroke="#22d3ee" stroke-width="1" opacity="0.05" stroke-dasharray="8,8"/>

  <!-- Lock icon (encryption) -->
  <g transform="translate(930, 680)">
    <rect x="0" y="12" width="28" height="22" rx="4" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.15"/>
    <path d="M6 12 V8 A8 8 0 0 1 22 8 V12" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.15"/>
    <circle cx="14" cy="23" r="3" fill="#22d3ee" opacity="0.12"/>
  </g>

  <!-- Network nodes at mountain peaks -->
  <circle cx="550" cy="480" r="6" fill="#22d3ee" opacity="0.12"/>
  <circle cx="960" cy="400" r="8" fill="#22d3ee" opacity="0.15"/>
  <circle cx="1370" cy="500" r="6" fill="#22d3ee" opacity="0.12"/>
  <circle cx="1750" cy="520" r="5" fill="#22d3ee" opacity="0.1"/>
  <circle cx="180" cy="580" r="5" fill="#22d3ee" opacity="0.1"/>
</svg>