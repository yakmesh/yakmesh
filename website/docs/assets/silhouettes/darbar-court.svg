<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="darbarGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#101a16" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="throneGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#101a16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillarShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#a5b4fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- MOUNTAIN BACKDROP -->
  <polygon points="0,620 240,280 480,560 0,1080" fill="#1a2a22" opacity="0.3"/>
  <polygon points="1500,650 1720,260 1920,540 1920,1080 1450,1080" fill="#1a2a22" opacity="0.3"/>
  <polygon points="100,700 380,380 660,650 100,1080" fill="#1a2a22" opacity="0.2"/>
  <polygon points="1350,700 1600,350 1850,680 1920,1080 1300,1080" fill="#1a2a22" opacity="0.2"/>

  <!-- Central atmospheric glow -->
  <ellipse cx="960" cy="450" rx="500" ry="350" fill="url(#darbarGlow)"/>
  <ellipse cx="960" cy="400" rx="300" ry="250" fill="url(#throneGlow)"/>

  <!-- ═══ THE ROYAL COURT ═══ -->

  <!-- RAISED PLATFORM / DAIS -->
  <polygon points="560,720 660,680 1260,680 1360,720 1380,750 540,750" fill="#1e1b4b" opacity="0.5"/>
  <line x1="560" y1="720" x2="1360" y2="720" stroke="#6366f1" stroke-width="1.5" opacity="0.25"/>
  <polygon points="540,750 580,780 1340,780 1380,750" fill="#1e1b4b" opacity="0.35"/>

  <!-- ORNAMENTAL STEPS (3 tiers) -->
  <rect x="620" y="780" width="680" height="15" fill="#1e1b4b" opacity="0.3" rx="2"/>
  <line x1="620" y1="780" x2="1300" y2="780" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
  <rect x="580" y="795" width="760" height="15" fill="#1e1b4b" opacity="0.25" rx="2"/>
  <line x1="580" y1="795" x2="1340" y2="795" stroke="#6366f1" stroke-width="1" opacity="0.15"/>
  <rect x="540" y="810" width="840" height="15" fill="#1e1b4b" opacity="0.2" rx="2"/>

  <!-- LEFT PILLARS (colonnade) -->
  <rect x="420" y="320" width="28" height="510" fill="url(#pillarShade)" rx="4"/>
  <rect x="420" y="320" width="28" height="510" stroke="#a5b4fc" stroke-width="1" fill="none" opacity="0.15"/>
  <ellipse cx="434" cy="318" rx="18" ry="6" fill="#6366f1" opacity="0.2"/>

  <rect x="510" y="360" width="24" height="470" fill="url(#pillarShade)" rx="3"/>
  <rect x="510" y="360" width="24" height="470" stroke="#a5b4fc" stroke-width="1" fill="none" opacity="0.12"/>
  <ellipse cx="522" cy="358" rx="16" ry="5" fill="#6366f1" opacity="0.18"/>

  <rect x="590" y="390" width="22" height="440" fill="url(#pillarShade)" rx="3"/>
  <rect x="590" y="390" width="22" height="440" stroke="#a5b4fc" stroke-width="1" fill="none" opacity="0.1"/>
  <ellipse cx="601" cy="388" rx="15" ry="5" fill="#6366f1" opacity="0.15"/>

  <!-- RIGHT PILLARS (colonnade) -->
  <rect x="1472" y="320" width="28" height="510" fill="url(#pillarShade)" rx="4"/>
  <rect x="1472" y="320" width="28" height="510" stroke="#a5b4fc" stroke-width="1" fill="none" opacity="0.15"/>
  <ellipse cx="1486" cy="318" rx="18" ry="6" fill="#6366f1" opacity="0.2"/>

  <rect x="1386" y="360" width="24" height="470" fill="url(#pillarShade)" rx="3"/>
  <rect x="1386" y="360" width="24" height="470" stroke="#a5b4fc" stroke-width="1" fill="none" opacity="0.12"/>
  <ellipse cx="1398" cy="358" rx="16" ry="5" fill="#6366f1" opacity="0.18"/>

  <rect x="1308" y="390" width="22" height="440" fill="url(#pillarShade)" rx="3"/>
  <rect x="1308" y="390" width="22" height="440" stroke="#a5b4fc" stroke-width="1" fill="none" opacity="0.1"/>
  <ellipse cx="1319" cy="388" rx="15" ry="5" fill="#6366f1" opacity="0.15"/>

  <!-- ORNATE ARCH spanning top (between outer pillars) -->
  <path d="M 434,320 Q 960,180 1486,320" fill="none" stroke="#a5b4fc" stroke-width="2" opacity="0.2"/>
  <path d="M 434,325 Q 960,190 1486,325" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.12"/>

  <!-- Arch keystone -->
  <polygon points="948,205 960,190 972,205 968,215 952,215" fill="#a5b4fc" opacity="0.2"/>

  <!-- Decorative arch filigree -->
  <path d="M 550,290 Q 750,220 960,210 Q 1170,220 1370,290" fill="none" stroke="#a5b4fc" stroke-width="0.8" opacity="0.1" stroke-dasharray="4,8"/>

  <!-- ═══ THE THRONE ═══ -->
  <!-- Throne back (tall ornate rectangle with pointed top) -->
  <path d="M 910,380 L 910,540 L 1010,540 L 1010,380 Q 960,340 910,380 Z" fill="#1e1b4b" opacity="0.6" stroke="#a5b4fc" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Throne inner frame -->
  <path d="M 920,400 L 920,530 L 1000,530 L 1000,400 Q 960,368 920,400 Z" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.2"/>

  <!-- Throne seat -->
  <rect x="895" y="540" width="130" height="40" fill="#1e1b4b" opacity="0.5" rx="3"/>
  <rect x="895" y="540" width="130" height="40" stroke="#a5b4fc" stroke-width="1" fill="none" opacity="0.2"/>

  <!-- Throne armrests -->
  <rect x="880" y="480" width="18" height="100" fill="#1e1b4b" opacity="0.4" rx="3"/>
  <rect x="880" y="480" width="18" height="100" stroke="#6366f1" stroke-width="1" fill="none" opacity="0.15"/>
  <rect x="1022" y="480" width="18" height="100" fill="#1e1b4b" opacity="0.4" rx="3"/>
  <rect x="1022" y="480" width="18" height="100" stroke="#6366f1" stroke-width="1" fill="none" opacity="0.15"/>

  <!-- Throne base/pedestal -->
  <polygon points="870,580 890,610 1030,610 1050,580" fill="#1e1b4b" opacity="0.4"/>
  <line x1="870" y1="580" x2="1050" y2="580" stroke="#a5b4fc" stroke-width="1" opacity="0.2"/>

  <!-- Crown/crest above throne -->
  <polygon points="940,355 960,335 980,355" fill="#a5b4fc" opacity="0.15" stroke="#a5b4fc" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="960" cy="340" r="4" fill="#c7d2fe" opacity="0.2"/>

  <!-- ═══ PETITION SCROLLS (left side) ═══ -->
  <rect x="680" y="560" width="60" height="12" rx="6" fill="#6366f1" opacity="0.15"/>
  <rect x="700" y="580" width="50" height="10" rx="5" fill="#6366f1" opacity="0.12"/>
  <rect x="710" y="596" width="45" height="10" rx="5" fill="#6366f1" opacity="0.1"/>

  <!-- ═══ ROYAL SEAL (right side) ═══ -->
  <circle cx="1200" cy="570" r="25" fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity="0.2"/>
  <circle cx="1200" cy="570" r="15" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.15"/>
  <circle cx="1200" cy="570" r="5" fill="#a5b4fc" opacity="0.15"/>

  <!-- ═══ 6 AUTH LEVEL MARKERS (along the steps) ═══ -->
  <!-- PUBLIC -->
  <circle cx="640" cy="820" r="4" fill="#a5b4fc" opacity="0.15"/>
  <text x="640" y="840" fill="#a5b4fc" opacity="0.1" font-size="9" font-family="monospace" text-anchor="middle">PUBLIC</text>
  <!-- MESH -->
  <circle cx="770" cy="820" r="4" fill="#a5b4fc" opacity="0.18"/>
  <text x="770" y="840" fill="#a5b4fc" opacity="0.1" font-size="9" font-family="monospace" text-anchor="middle">MESH</text>
  <!-- PEER -->
  <circle cx="900" cy="820" r="4" fill="#a5b4fc" opacity="0.22"/>
  <text x="900" y="840" fill="#a5b4fc" opacity="0.1" font-size="9" font-family="monospace" text-anchor="middle">PEER</text>
  <!-- ANNEX -->
  <circle cx="1020" cy="820" r="4" fill="#a5b4fc" opacity="0.25"/>
  <text x="1020" y="840" fill="#a5b4fc" opacity="0.1" font-size="9" font-family="monospace" text-anchor="middle">ANNEX</text>
  <!-- ADMIN -->
  <circle cx="1140" cy="820" r="4" fill="#c7d2fe" opacity="0.28"/>
  <text x="1140" y="840" fill="#a5b4fc" opacity="0.1" font-size="9" font-family="monospace" text-anchor="middle">ADMIN</text>
  <!-- HOST -->
  <circle cx="1260" cy="820" r="4" fill="#c7d2fe" opacity="0.3"/>
  <text x="1260" y="840" fill="#a5b4fc" opacity="0.1" font-size="9" font-family="monospace" text-anchor="middle">HOST</text>

  <!-- ═══ DECORATIVE BANNERS (hanging from arch) ═══ -->
  <!-- Left banner -->
  <rect x="520" y="295" width="16" height="60" fill="#4f46e5" opacity="0.12" rx="2"/>
  <polygon points="520,355 528,370 536,355" fill="#4f46e5" opacity="0.1"/>
  <!-- Right banner -->
  <rect x="1384" y="295" width="16" height="60" fill="#4f46e5" opacity="0.12" rx="2"/>
  <polygon points="1384,355 1392,370 1400,355" fill="#4f46e5" opacity="0.1"/>

  <!-- ═══ ROUTE PATHS (subtle lines from throne outward) ═══ -->
  <!-- These represent the declarative routes emanating from the court -->
  <line x1="960" y1="620" x2="500" y2="850" stroke="#6366f1" stroke-width="0.8" opacity="0.08" stroke-dasharray="6,10"/>
  <line x1="960" y1="620" x2="700" y2="870" stroke="#6366f1" stroke-width="0.8" opacity="0.08" stroke-dasharray="6,10"/>
  <line x1="960" y1="620" x2="1220" y2="870" stroke="#6366f1" stroke-width="0.8" opacity="0.08" stroke-dasharray="6,10"/>
  <line x1="960" y1="620" x2="1420" y2="850" stroke="#6366f1" stroke-width="0.8" opacity="0.08" stroke-dasharray="6,10"/>

  <!-- ═══ GROUND ═══ -->
  <polygon points="0,900 300,870 600,910 960,880 1300,920 1600,875 1920,900 1920,1080 0,1080" fill="#101a16" opacity="0.7"/>

  <!-- Ground detail line -->
  <line x1="0" y1="910" x2="1920" y2="910" stroke="#6366f1" stroke-width="0.5" opacity="0.06"/>
</svg>
