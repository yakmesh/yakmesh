<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <radialGradient id="sanghaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#101a16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#101a16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreFire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#fb923c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- MOUNTAIN BACKDROP -->
  <polygon points="0,650 200,350 400,600 400,1080 0,1080" fill="#1a2a22" opacity="0.4"/>
  <polygon points="300,680 500,380 700,620 700,1080 300,1080" fill="#1a2a22" opacity="0.5"/>
  <polygon points="1200,660 1450,320 1700,600 1700,1080 1200,1080" fill="#1a2a22" opacity="0.5"/>
  <polygon points="1500,680 1800,400 1920,650 1920,1080 1500,1080" fill="#1a2a22" opacity="0.4"/>

  <!-- SANGHA COMMUNITY GATHERING -->
  <circle cx="960" cy="540" r="500" fill="url(#sanghaGlow)"/>

  <!-- Web of Consensus / Community -->
  <g fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.3">
    <!-- Starburst connections radiating from center -->
    <path d="M960,540 L700,300 M960,540 L1220,300 M960,540 L600,650 M960,540 L1320,650 M960,540 L750,900 M960,540 L1170,900 M960,540 L960,180 M960,540 L960,950"/>
    <!-- Concentric community rings (polygon ripples) -->
    <polygon points="960,340 1090,430 1090,650 960,740 830,650 830,430"/>
    <polygon points="960,140 1260,365 1260,715 960,940 660,715 660,365"/>
  </g>
  
  <g fill="none" stroke="#f97316" stroke-width="2" opacity="0.5" stroke-dasharray="8 8">
    <circle cx="960" cy="540" r="280"/>
    <circle cx="960" cy="540" r="450"/>
  </g>

  <!-- Core Assembly / Lotus Heart -->
  <circle cx="960" cy="540" r="100" fill="url(#coreFire)"/>
  <path d="M960,450 Q 1000,540 960,630 Q 920,540 960,450" fill="#fed7aa" opacity="0.6"/>
  <path d="M870,540 Q 960,580 1050,540 Q 960,500 870,540" fill="#fed7aa" opacity="0.6"/>
  <circle cx="960" cy="540" r="15" fill="#fffaf0" opacity="0.9"/>
  <circle cx="960" cy="540" r="30" fill="none" stroke="#fed7aa" stroke-width="3" opacity="0.8"/>

  <!-- Satellite Monks / Nodes in the Sangha -->
  <!-- Inner Ring -->
  <g opacity="0.9">
    <circle cx="960" cy="340" r="8" fill="#fb923c"/><circle cx="960" cy="340" r="20" fill="url(#nodeGlow)"/>
    <circle cx="1090" cy="430" r="8" fill="#f97316"/><circle cx="1090" cy="430" r="20" fill="url(#nodeGlow)"/>
    <circle cx="1090" cy="650" r="8" fill="#fb923c"/><circle cx="1090" cy="650" r="20" fill="url(#nodeGlow)"/>
    <circle cx="960" cy="740" r="8" fill="#f97316"/><circle cx="960" cy="740" r="20" fill="url(#nodeGlow)"/>
    <circle cx="830" cy="650" r="8" fill="#fb923c"/><circle cx="830" cy="650" r="20" fill="url(#nodeGlow)"/>
    <circle cx="830" cy="430" r="8" fill="#f97316"/><circle cx="830" cy="430" r="20" fill="url(#nodeGlow)"/>
  </g>
  
  <!-- Outer Ring Gatherers -->
  <g opacity="0.7">
    <circle cx="960" cy="140" r="12" fill="#fed7aa"/><circle cx="960" cy="140" r="30" fill="url(#nodeGlow)"/>
    <circle cx="1260" cy="365" r="10" fill="#fb923c"/><circle cx="1260" cy="365" r="25" fill="url(#nodeGlow)"/>
    <circle cx="1260" cy="715" r="10" fill="#f97316"/><circle cx="1260" cy="715" r="25" fill="url(#nodeGlow)"/>
    <circle cx="960" cy="940" r="12" fill="#fed7aa"/><circle cx="960" cy="940" r="30" fill="url(#nodeGlow)"/>
    <circle cx="660" cy="715" r="10" fill="#fb923c"/><circle cx="660" cy="715" r="25" fill="url(#nodeGlow)"/>
    <circle cx="660" cy="365" r="10" fill="#f97316"/><circle cx="660" cy="365" r="25" fill="url(#nodeGlow)"/>
    
    <!-- Edge stragglers joining -->
    <circle cx="450" cy="200" r="6" fill="#ea580c"/>
    <path d="M450,200 L660,365" fill="none" stroke="#ea580c" stroke-width="1" opacity="0.4" stroke-dasharray="4 4"/>
    
    <circle cx="1470" cy="850" r="6" fill="#ea580c"/>
    <path d="M1470,850 L1260,715" fill="none" stroke="#ea580c" stroke-width="1" opacity="0.4" stroke-dasharray="4 4"/>
  </g>

</svg>
