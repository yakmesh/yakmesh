<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="hubGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4a8a6a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#101a16" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- MOUNTAIN BACKDROP -->
  <polygon points="0,650 200,380 400,600 0,1080" fill="#1a2a22" opacity="0.3"/>
  <polygon points="1600,620 1800,350 1920,550 1920,1080 1600,1080" fill="#1a2a22" opacity="0.3"/>
  
  <!-- CENTER - API Hub hexagon -->
  <polygon points="960,180 1160,280 1160,480 960,580 760,480 760,280" fill="#0a120e" opacity="0.9"/>
  <polygon points="960,180 1160,280 1160,480 960,580 760,480 760,280" stroke="#4a8a6a" stroke-width="4" fill="none" opacity="0.6"/>
  <polygon points="960,220 1120,300 1120,460 960,540 800,460 800,300" stroke="#3d6a5a" stroke-width="2" fill="none" opacity="0.35"/>
  
  <!-- API label in center -->
  <text x="960" y="360" fill="#5a9a7a" opacity="0.7" font-size="48" font-family="monospace" text-anchor="middle">API</text>
  <text x="960" y="410" fill="#4a8a6a" opacity="0.5" font-size="20" font-family="monospace" text-anchor="middle">GATEWAY</text>
  
  <!-- Glow behind hub -->
  <ellipse cx="960" cy="380" rx="250" ry="250" fill="url(#hubGlow)"/>
  
  <!-- ENDPOINT BOXES arranged around the hub -->
  
  <!-- TOP LEFT - /auth -->
  <rect x="350" y="100" width="200" height="100" rx="10" fill="#1a2a22" opacity="0.8"/>
  <rect x="350" y="100" width="200" height="100" rx="10" stroke="#3d6a5a" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="450" y="145" fill="#4a8a6a" opacity="0.6" font-size="16" font-family="monospace" text-anchor="middle">POST</text>
  <text x="450" y="175" fill="#5a9a7a" opacity="0.5" font-size="20" font-family="monospace" text-anchor="middle">/auth</text>
  <line x1="550" y1="150" x2="760" y2="280" stroke="#3d6a5a" stroke-width="2" opacity="0.4"/>
  <circle cx="650" cy="215" r="4" fill="#4a8a6a" opacity="0.5"/>
  
  <!-- TOP RIGHT - /nodes -->
  <rect x="1370" y="100" width="200" height="100" rx="10" fill="#1a2a22" opacity="0.8"/>
  <rect x="1370" y="100" width="200" height="100" rx="10" stroke="#3d6a5a" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="1470" y="145" fill="#4a8a6a" opacity="0.6" font-size="16" font-family="monospace" text-anchor="middle">GET</text>
  <text x="1470" y="175" fill="#5a9a7a" opacity="0.5" font-size="20" font-family="monospace" text-anchor="middle">/nodes</text>
  <line x1="1370" y1="150" x2="1160" y2="280" stroke="#3d6a5a" stroke-width="2" opacity="0.4"/>
  <circle cx="1265" cy="215" r="4" fill="#4a8a6a" opacity="0.5"/>
  
  <!-- LEFT - /geo -->
  <rect x="200" y="320" width="200" height="100" rx="10" fill="#1a2a22" opacity="0.8"/>
  <rect x="200" y="320" width="200" height="100" rx="10" stroke="#3d6a5a" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="300" y="365" fill="#4a8a6a" opacity="0.6" font-size="16" font-family="monospace" text-anchor="middle">POST</text>
  <text x="300" y="395" fill="#5a9a7a" opacity="0.5" font-size="20" font-family="monospace" text-anchor="middle">/geo/proof</text>
  <line x1="400" y1="370" x2="760" y2="380" stroke="#4a8a6a" stroke-width="3" opacity="0.5"/>
  <circle cx="580" cy="375" r="5" fill="#5a9a7a" opacity="0.5"/>
  
  <!-- RIGHT - /sync -->
  <rect x="1520" y="320" width="200" height="100" rx="10" fill="#1a2a22" opacity="0.8"/>
  <rect x="1520" y="320" width="200" height="100" rx="10" stroke="#3d6a5a" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="1620" y="365" fill="#4a8a6a" opacity="0.6" font-size="16" font-family="monospace" text-anchor="middle">WS</text>
  <text x="1620" y="395" fill="#5a9a7a" opacity="0.5" font-size="20" font-family="monospace" text-anchor="middle">/sync</text>
  <line x1="1520" y1="370" x2="1160" y2="380" stroke="#4a8a6a" stroke-width="3" opacity="0.5"/>
  <circle cx="1340" cy="375" r="5" fill="#5a9a7a" opacity="0.5"/>
  
  <!-- BOTTOM LEFT - /time -->
  <rect x="350" y="550" width="200" height="100" rx="10" fill="#1a2a22" opacity="0.8"/>
  <rect x="350" y="550" width="200" height="100" rx="10" stroke="#3d6a5a" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="450" y="595" fill="#4a8a6a" opacity="0.6" font-size="16" font-family="monospace" text-anchor="middle">GET</text>
  <text x="450" y="625" fill="#5a9a7a" opacity="0.5" font-size="20" font-family="monospace" text-anchor="middle">/time</text>
  <line x1="550" y1="600" x2="760" y2="480" stroke="#3d6a5a" stroke-width="2" opacity="0.4"/>
  <circle cx="655" cy="540" r="4" fill="#4a8a6a" opacity="0.5"/>
  
  <!-- BOTTOM RIGHT - /mesh -->
  <rect x="1370" y="550" width="200" height="100" rx="10" fill="#1a2a22" opacity="0.8"/>
  <rect x="1370" y="550" width="200" height="100" rx="10" stroke="#3d6a5a" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="1470" y="595" fill="#4a8a6a" opacity="0.6" font-size="16" font-family="monospace" text-anchor="middle">POST</text>
  <text x="1470" y="625" fill="#5a9a7a" opacity="0.5" font-size="20" font-family="monospace" text-anchor="middle">/mesh</text>
  <line x1="1370" y1="600" x2="1160" y2="480" stroke="#3d6a5a" stroke-width="2" opacity="0.4"/>
  <circle cx="1265" cy="540" r="4" fill="#4a8a6a" opacity="0.5"/>
  
  <!-- BOTTOM CENTER - /oracle -->
  <rect x="860" y="680" width="200" height="100" rx="10" fill="#1a2a22" opacity="0.8"/>
  <rect x="860" y="680" width="200" height="100" rx="10" stroke="#3d6a5a" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="960" y="725" fill="#4a8a6a" opacity="0.6" font-size="16" font-family="monospace" text-anchor="middle">POST</text>
  <text x="960" y="755" fill="#5a9a7a" opacity="0.5" font-size="20" font-family="monospace" text-anchor="middle">/oracle</text>
  <line x1="960" y1="680" x2="960" y2="580" stroke="#4a8a6a" stroke-width="3" opacity="0.5"/>
  <circle cx="960" cy="630" r="5" fill="#5a9a7a" opacity="0.5"/>
  
  <!-- Additional small endpoints floating -->
  <rect x="100" y="550" width="120" height="60" rx="5" fill="#1a2a22" opacity="0.6"/>
  <text x="160" y="590" fill="#3d6a5a" opacity="0.4" font-size="14" font-family="monospace" text-anchor="middle">/health</text>
  
  <rect x="1700" y="550" width="120" height="60" rx="5" fill="#1a2a22" opacity="0.6"/>
  <text x="1760" y="590" fill="#3d6a5a" opacity="0.4" font-size="14" font-family="monospace" text-anchor="middle">/metrics</text>
  
  <rect x="600" y="720" width="120" height="60" rx="5" fill="#1a2a22" opacity="0.6"/>
  <text x="660" y="760" fill="#3d6a5a" opacity="0.4" font-size="14" font-family="monospace" text-anchor="middle">/config</text>
  
  <rect x="1200" y="720" width="120" height="60" rx="5" fill="#1a2a22" opacity="0.6"/>
  <text x="1260" y="760" fill="#3d6a5a" opacity="0.4" font-size="14" font-family="monospace" text-anchor="middle">/status</text>
  
  <!-- HTTP methods legend at bottom -->
  <rect x="700" y="850" width="60" height="30" rx="5" fill="#2e4c43" opacity="0.4"/>
  <text x="730" y="870" fill="#4a8a6a" opacity="0.5" font-size="12" font-family="monospace" text-anchor="middle">GET</text>
  
  <rect x="780" y="850" width="60" height="30" rx="5" fill="#3d6a5a" opacity="0.4"/>
  <text x="810" y="870" fill="#4a8a6a" opacity="0.5" font-size="12" font-family="monospace" text-anchor="middle">POST</text>
  
  <rect x="860" y="850" width="60" height="30" rx="5" fill="#4a8a6a" opacity="0.4"/>
  <text x="890" y="870" fill="#5a9a7a" opacity="0.5" font-size="12" font-family="monospace" text-anchor="middle">PUT</text>
  
  <rect x="940" y="850" width="60" height="30" rx="5" fill="#2e4c43" opacity="0.4"/>
  <text x="970" y="870" fill="#4a8a6a" opacity="0.5" font-size="12" font-family="monospace" text-anchor="middle">WS</text>
  
  <!-- Response arrows going back -->
  <polygon points="450,210 445,200 455,200" fill="#4a8a6a" opacity="0.4"/>
  <polygon points="1490,210 1485,200 1495,200" fill="#4a8a6a" opacity="0.4"/>
  
  <!-- Ground -->
  <polygon points="0,920 300,900 600,950 900,920 1200,970 1500,930 1920,980 1920,1080 0,1080" fill="#101a16" opacity="0.75"/>
</svg>