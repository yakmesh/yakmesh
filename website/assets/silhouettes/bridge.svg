<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="bridgeGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3d6a5a" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#4a8a6a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3d6a5a" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <!-- LEFT CLIFF/MOUNTAIN -->
  <polygon points="0,0 350,0 300,200 250,400 200,600 250,800 350,1080 0,1080" fill="#101a16"/>
  <path d="M300,200 Q280,400 200,600 Q220,800 350,1080" stroke="#2e4c43" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Cliff texture -->
  <line x1="280" y1="300" x2="320" y2="290" stroke="#2e4c43" stroke-width="1" opacity="0.25"/>
  <line x1="220" y1="500" x2="270" y2="510" stroke="#2e4c43" stroke-width="1" opacity="0.25"/>
  <line x1="200" y1="700" x2="260" y2="690" stroke="#2e4c43" stroke-width="1" opacity="0.25"/>
  
  <!-- RIGHT CLIFF/MOUNTAIN -->
  <polygon points="1920,0 1570,0 1620,200 1670,400 1720,600 1670,800 1570,1080 1920,1080" fill="#101a16"/>
  <path d="M1620,200 Q1640,400 1720,600 Q1700,800 1570,1080" stroke="#2e4c43" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Cliff texture -->
  <line x1="1640" y1="300" x2="1600" y2="290" stroke="#2e4c43" stroke-width="1" opacity="0.25"/>
  <line x1="1700" y1="500" x2="1650" y2="510" stroke="#2e4c43" stroke-width="1" opacity="0.25"/>
  <line x1="1720" y1="700" x2="1660" y2="690" stroke="#2e4c43" stroke-width="1" opacity="0.25"/>
  
  <!-- THE CHASM - deep below -->
  <polygon points="350,1080 400,900 600,850 960,820 1320,850 1520,900 1570,1080" fill="#0a120e" opacity="0.8"/>
  
  <!-- Distant mountains through the gap -->
  <polygon points="500,800 700,500 900,720" fill="#1a2a22" opacity="0.35"/>
  <polygon points="800,780 960,450 1120,750" fill="#1a2a22" opacity="0.4"/>
  <polygon points="1000,790 1200,520 1400,760" fill="#1a2a22" opacity="0.35"/>
  
  <!-- THE ROPE BRIDGE -->
  <!-- Main cables -->
  <path d="M280,580 Q600,650 960,680 Q1320,650 1640,580" stroke="#3d6a5a" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M300,620 Q620,700 960,730 Q1300,700 1620,620" stroke="#3d6a5a" stroke-width="3" fill="none" opacity="0.4"/>
  
  <!-- Bridge deck (walkway) -->
  <path d="M290,600 Q620,680 960,710 Q1300,680 1630,600" stroke="#2e4c43" stroke-width="12" fill="none" opacity="0.6"/>
  
  <!-- Vertical rope supports -->
  <line x1="400" y1="605" x2="420" y2="665" stroke="#3d6a5a" stroke-width="2" opacity="0.35"/>
  <line x1="550" y1="625" x2="560" y2="695" stroke="#3d6a5a" stroke-width="2" opacity="0.35"/>
  <line x1="700" y1="650" x2="705" y2="720" stroke="#3d6a5a" stroke-width="2" opacity="0.35"/>
  <line x1="850" y1="665" x2="852" y2="738" stroke="#3d6a5a" stroke-width="2" opacity="0.35"/>
  <line x1="960" y1="680" x2="960" y2="730" stroke="#4a8a6a" stroke-width="2" opacity="0.4"/>
  <line x1="1070" y1="665" x2="1068" y2="738" stroke="#3d6a5a" stroke-width="2" opacity="0.35"/>
  <line x1="1220" y1="650" x2="1215" y2="720" stroke="#3d6a5a" stroke-width="2" opacity="0.35"/>
  <line x1="1370" y1="625" x2="1360" y2="695" stroke="#3d6a5a" stroke-width="2" opacity="0.35"/>
  <line x1="1520" y1="605" x2="1500" y2="665" stroke="#3d6a5a" stroke-width="2" opacity="0.35"/>
  
  <!-- Bridge glow -->
  <ellipse cx="960" cy="700" rx="500" ry="80" fill="url(#bridgeGlow)"/>
  
  <!-- Anchor posts on each side -->
  <rect x="260" y="550" width="40" height="80" fill="#1f332d" opacity="0.6"/>
  <rect x="1620" y="550" width="40" height="80" fill="#1f332d" opacity="0.6"/>
  
  <!-- Connection indicators (P2P nodes) -->
  <circle cx="280" cy="590" r="8" fill="#4a8a6a" opacity="0.4"/>
  <circle cx="1640" cy="590" r="8" fill="#4a8a6a" opacity="0.4"/>
  <!-- Data flowing across -->
  <circle cx="500" cy="640" r="4" fill="#4a8a6a" opacity="0.3"/>
  <circle cx="750" cy="670" r="4" fill="#4a8a6a" opacity="0.35"/>
  <circle cx="960" cy="680" r="5" fill="#5a9a7a" opacity="0.45"/>
  <circle cx="1170" cy="670" r="4" fill="#4a8a6a" opacity="0.35"/>
  <circle cx="1420" cy="640" r="4" fill="#4a8a6a" opacity="0.3"/>
</svg>