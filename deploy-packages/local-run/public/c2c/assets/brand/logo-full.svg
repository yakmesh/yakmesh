<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">

  <g transform="translate(10,10)">
    <!-- Firmament dome -->
    <path d="M50 95 L10 95 Q5 95 5 90 L5 60 Q50 5 95 60 L95 90 Q95 95 90 95 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- Pillars -->
    <line x1="20" y1="95" x2="20" y2="110" stroke="currentColor" stroke-width="2.5"/>
    <line x1="50" y1="95" x2="50" y2="115" stroke="currentColor" stroke-width="2.5"/>
    <line x1="80" y1="95" x2="80" y2="110" stroke="currentColor" stroke-width="2.5"/>
    <!-- Star in dome -->
    <polygon points="50,25 54,38 67,38 56,46 60,59 50,51 40,59 44,46 33,38 46,38" fill="currentColor" stroke="none"/>
    <!-- Energy lines in dome -->
    <path d="M25 70 Q50 30 75 70" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
    <path d="M15 80 Q50 45 85 80" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.3"/>
  </g>
  <!-- Wordmark -->
  <text x="130" y="55" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="currentColor" letter-spacing="4">CORE TO COSMOS</text>
  <text x="130" y="80" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" opacity="0.6" letter-spacing="6">MASTER YOUR WORLD</text>
</svg>