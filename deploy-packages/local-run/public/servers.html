<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Yakmesh — C2C Server Directory</title>
    <style>
        /* ===== Reset & Dark theme ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #263548;
            --bg-input: #1e293b;
            --border: #334155;
            --border-active: #3b82f6;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --text-muted: #475569;
            --accent: #3b82f6;
            --green: #22c55e;
            --amber: #f59e0b;
            --red: #ef4444
        }

        html {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 15px;
            line-height: 1.5
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column
        }

        a {
            color: var(--accent);
            text-decoration: none
        }

        a:hover {
            text-decoration: underline
        }

        /* ===== Layout ===== */
        .page {
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px
        }

        header .tagline {
            font-size: 12px;
            color: var(--text-muted);
            width: 100%
        }

        .stats {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 12px
        }

        /* ===== Controls ===== */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px
        }

        .search-row {
            display: flex;
            gap: 8px
        }

        #search {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            outline: none
        }

        #search:focus {
            border-color: var(--border-active);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, .15)
        }

        #search::placeholder {
            color: var(--text-muted)
        }

        .btn {
            border: none;
            cursor: pointer;
            font-size: 13px;
            border-radius: 6px;
            padding: 6px 14px;
            transition: all .15s
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-dim)
        }

        .btn-ghost:hover {
            background: var(--bg-card);
            color: var(--text)
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            font-weight: 600
        }

        .btn-primary:hover {
            background: #2563eb
        }

        .btn-green {
            background: var(--green);
            color: var(--bg);
            font-weight: 600;
            padding: 8px 16px
        }

        .btn-green:hover {
            background: #16a34a
        }

        .filters {
            display: flex;
            gap: 4px;
            flex-wrap: wrap
        }

        .fbtn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all .15s
        }

        .fbtn:hover {
            background: var(--border);
            color: var(--text)
        }

        .fbtn.active {
            background: #1e3a5f;
            border-color: var(--accent);
            color: #93c5fd
        }

        /* ===== Server cards ===== */
        #list {
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px
        }

        .server {
            padding: 12px 14px;
            background: var(--bg-card);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all .15s
        }

        .server:hover {
            background: var(--bg-hover);
            border-color: var(--border)
        }

        .server.selected {
            background: #1e3a5f;
            border-color: var(--accent)
        }

        .server.dimmed {
            opacity: .5
        }

        .server.featured {
            border-color: rgba(245, 158, 11, .2);
            background: linear-gradient(135deg, var(--bg-card), #2d1f0a)
        }

        .server.featured:hover {
            border-color: rgba(245, 158, 11, .4)
        }

        .s-name {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 6px
        }

        .s-name.highlight {
            color: var(--amber);
            text-shadow: 0 0 8px rgba(251, 191, 36, .3)
        }

        .s-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-dim);
            flex-wrap: wrap
        }

        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .badge-online {
            background: #166534;
            color: #4ade80
        }

        .badge-stale {
            background: #713f12;
            color: #fbbf24
        }

        .badge-vacation {
            background: #1e3a5f;
            color: #93c5fd
        }

        .badge-maintenance {
            background: #581c87;
            color: #c084fc
        }

        .badge-offline {
            background: #374151;
            color: #9ca3af
        }

        .pool {
            margin-top: 4px;
            font-size: 12px;
            color: var(--amber)
        }

        .detail {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            display: none
        }

        .detail.open {
            display: block
        }

        .d-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 12px
        }

        .d-row span:first-child {
            color: var(--text-muted)
        }

        .d-row code {
            font-family: monospace;
            font-size: 11px;
            color: var(--text-dim);
            word-break: break-all
        }

        /* ===== Footer ===== */
        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: var(--text-muted)
        }

        /* ===== Loading spinner ===== */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .6s linear infinite;
            vertical-align: middle;
            margin-right: 6px
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* ===== Responsive ===== */
        @media(max-width:480px) {
            header h1 {
                font-size: 18px
            }

            .server {
                padding: 10px 12px
            }

            .s-meta {
                gap: 6px
            }
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted)
        }
    </style>
</head>

<body>
    <div class="page">
        <header>
            <h1>🏔️ C2C Server Directory</h1>
            <span class="tagline">Decentralized game server discovery via MANTRA gossip — no central registry</span>
        </header>

        <div class="stats" id="stats">
            <span class="spinner"></span> Loading directory…
        </div>

        <div class="controls">
            <div class="search-row">
                <input type="text" id="search" placeholder="Search servers…" autocomplete="off">
                <button class="btn btn-ghost" id="refreshBtn" title="Refresh">⟳ Refresh</button>
            </div>
            <div class="filters" id="filters">
                <button class="fbtn active" data-filter="all">All</button>
                <button class="fbtn" data-filter="online">🟢 Online</button>
                <button class="fbtn" data-filter="stale">🟡 Stale</button>
                <button class="fbtn" data-filter="vacation">🏖️ Vacation</button>
                <button class="fbtn" data-filter="maintenance">🔧 Maintenance</button>
                <button class="fbtn" data-filter="offline">⚫ Offline</button>
            </div>
        </div>

        <div id="list">
            <div class="empty">Loading…</div>
        </div>
    </div>

    <footer>
        Servers advertise via Yakmesh MANTRA gossip — identity names are cryptographically bound (DOKO cert).
        <br>Auto-refreshes every 30 s.
    </footer>

    <script>
        /* ===================================================================
         * Portable Server Browser — standalone, zero-dependency
         * Queries GET /servers from the host yakmesh-node
         * =================================================================== */
        (() => {
            'use strict';

            const REFRESH_MS = 30_000;
            const API_BASE = '';                          // same-origin
            let servers = [];
            let stats = {};
            let filter = 'all';
            let search = '';
            let selected = null;
            let timer = null;

            // ---- DOM refs ----
            const $list = document.getElementById('list');
            const $stats = document.getElementById('stats');
            const $search = document.getElementById('search');
            const $refresh = document.getElementById('refreshBtn');
            const $filters = document.getElementById('filters');

            // ---- Fetch ----
            async function fetchServers() {
                try {
                    const url = filter === 'all'
                        ? `${API_BASE}/servers`
                        : `${API_BASE}/servers?status=${filter}`;
                    const res = await fetch(url);
                    const json = await res.json();
                    servers = json.servers || [];
                    stats = json.stats || {};
                    renderStats();
                    renderList();
                } catch (e) {
                    $stats.textContent = '⚠ Failed to load directory';
                    $list.innerHTML = `<div class="empty">Could not reach server — ${e.message}</div>`;
                }
            }

            // ---- Render stats ----
            function renderStats() {
                const parts = [];
                if (stats.total != null) parts.push(`${stats.total} server${stats.total === 1 ? '' : 's'}`);
                if (stats.online != null) parts.push(`🟢 ${stats.online} online`);
                if (stats.stale != null && stats.stale > 0) parts.push(`🟡 ${stats.stale} stale`);
                if (stats.offline != null && stats.offline > 0) parts.push(`⚫ ${stats.offline} offline`);
                $stats.textContent = parts.join('  ·  ') || 'No servers found';
            }

            // ---- Render list ----
            function renderList() {
                const q = search.toLowerCase();
                const visible = servers.filter(s =>
                    !q || (s.name || '').toLowerCase().includes(q) || (s.nodeId || '').toLowerCase().includes(q)
                );

                if (!visible.length) {
                    $list.innerHTML = '<div class="empty">No servers match your search.</div>';
                    return;
                }

                $list.innerHTML = visible.map(s => {
                    const statusCls = `badge badge-${s.status || 'offline'}`;
                    const cardCls = [
                        'server',
                        s.nodeId === selected ? 'selected' : '',
                        s.status === 'offline' ? 'dimmed' : '',
                        (s.vip && s.vip.includes('featured_listing')) ? 'featured' : ''
                    ].filter(Boolean).join(' ');

                    const nameCls = (s.vip && s.vip.includes('name_highlight')) ? 's-name highlight' : 's-name';
                    const vipIcons = buildVipIcons(s.vip);
                    const badgeIcon = (s.vip && s.vip.includes('badge')) ? ' ⭐' : '';

                    let html = `<div class="${cardCls}" data-id="${esc(s.nodeId)}">`;
                    html += `<div class="${nameCls}">${vipIcons}${esc(s.name || s.nodeId)}${badgeIcon}</div>`;
                    html += `<div class="s-meta">`;
                    html += `<span class="${statusCls}">${esc(s.status || 'unknown')}</span>`;
                    if (s.playerCount != null) html += `<span>👥 ${s.playerCount}${s.maxPlayers ? '/' + s.maxPlayers : ''}</span>`;
                    if (s.uptime != null) html += `<span>⏱ ${fmtUptime(s.uptime)}</span>`;
                    if (s.version) html += `<span style="color:var(--text-muted);font-family:monospace;font-size:11px">${esc(s.version)}</span>`;
                    html += '</div>';
                    if (s.communityPool > 0) html += `<div class="pool">🏆 Community Pool: ${s.communityPool} SC</div>`;

                    // Detail panel
                    html += `<div class="detail${s.nodeId === selected ? ' open' : ''}" id="det-${esc(s.nodeId)}">`;
                    html += drow('Node ID', `<code>${esc(s.nodeId)}</code>`);
                    if (s.region) html += drow('Region', esc(s.region));
                    if (s.governanceScore != null) html += drow('Governance', s.governanceScore.toFixed(2));
                    if (s.firstSeen) html += drow('First Seen', timeAgo(s.firstSeen));
                    if (s.lastSeen) html += drow('Last Seen', timeAgo(s.lastSeen));
                    if (s.score != null) html += drow('Score', s.score.toFixed(3));
                    html += `<button class="btn btn-green" onclick="event.stopPropagation();connectTo('${esc(s.nodeId)}')">Connect</button>`;
                    html += '</div>';

                    html += '</div>';
                    return html;
                }).join('');
            }

            // ---- Helpers ----
            function buildVipIcons(vip) {
                if (!vip || !vip.length) return '';
                const icons = [];
                if (vip.includes('featured_listing')) icons.push('🔥');
                if (vip.includes('priority_connect')) icons.push('⚡');
                if (vip.includes('reserved_slot')) icons.push('🎫');
                return icons.length ? icons.join('') + ' ' : '';
            }

            function drow(label, value) {
                return `<div class="d-row"><span>${label}</span><span>${value}</span></div>`;
            }

            function fmtUptime(ms) {
                const s = Math.floor(ms / 1000);
                if (s < 60) return s + 's';
                if (s < 3600) return Math.floor(s / 60) + 'm';
                const h = Math.floor(s / 3600);
                const m = Math.floor((s % 3600) / 60);
                return h + 'h ' + m + 'm';
            }

            function timeAgo(ts) {
                const d = Date.now() - ts;
                if (d < 60_000) return 'just now';
                if (d < 3_600_000) return Math.floor(d / 60_000) + 'm ago';
                if (d < 86_400_000) return Math.floor(d / 3_600_000) + 'h ago';
                return Math.floor(d / 86_400_000) + 'd ago';
            }

            function esc(str) {
                if (str == null) return '';
                const d = document.createElement('div');
                d.appendChild(document.createTextNode(String(str)));
                return d.innerHTML;
            }

            // ---- Connect handler (opens WS or navigates) ----
            window.connectTo = function (nodeId) {
                const s = servers.find(x => x.nodeId === nodeId);
                if (!s) return;
                // If we know the host address from beacon data, navigate there
                // Otherwise just alert the nodeId so yakapp / external tool can connect
                alert(`Connect to: ${s.name || s.nodeId}\nNode ID: ${s.nodeId}\n\nUse yakapp or the mesh client to join.`);
            };

            // ---- Event handlers ----
            $search.addEventListener('input', () => {
                search = $search.value;
                renderList();
            });

            $refresh.addEventListener('click', () => fetchServers());

            $list.addEventListener('click', (e) => {
                const card = e.target.closest('.server');
                if (!card) return;
                const id = card.dataset.id;
                selected = selected === id ? null : id;
                renderList();
            });

            $filters.addEventListener('click', (e) => {
                const btn = e.target.closest('.fbtn');
                if (!btn) return;
                filter = btn.dataset.filter;
                $filters.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selected = null;
                fetchServers();
            });

            // ---- Init ----
            fetchServers();
            timer = setInterval(fetchServers, REFRESH_MS);

        })();
    </script>
</body>

</html>
