<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" opacity="0.04">
  <!-- Tutorials - Open book with numbered steps and learning path -->
  <!-- Open book -->
  <path d="M200 80 L200 340" stroke="#10b981" stroke-width="2"/>
  <path d="M80 90 Q140 80 200 80 Q260 80 320 90 L320 340 Q260 330 200 340 Q140 330 80 340 Z" fill="none" stroke="#10b981" stroke-width="2"/>
  <!-- Left page lines -->
  <line x1="105" y1="120" x2="185" y2="120" stroke="#10b981" stroke-width="1"/>
  <line x1="105" y1="140" x2="180" y2="140" stroke="#10b981" stroke-width="1"/>
  <line x1="105" y1="160" x2="175" y2="160" stroke="#10b981" stroke-width="1"/>
  <line x1="105" y1="195" x2="185" y2="195" stroke="#10b981" stroke-width="1"/>
  <line x1="105" y1="215" x2="170" y2="215" stroke="#10b981" stroke-width="1"/>
  <line x1="105" y1="235" x2="180" y2="235" stroke="#10b981" stroke-width="1"/>
  <!-- Right page - numbered steps -->
  <circle cx="230" cy="120" r="8" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="230" y="124" text-anchor="middle" fill="#10b981" font-size="10" font-weight="bold">1</text>
  <line x1="242" y1="120" x2="295" y2="120" stroke="#10b981" stroke-width="1"/>
  <circle cx="230" cy="160" r="8" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="230" y="164" text-anchor="middle" fill="#10b981" font-size="10" font-weight="bold">2</text>
  <line x1="242" y1="160" x2="290" y2="160" stroke="#10b981" stroke-width="1"/>
  <circle cx="230" cy="200" r="8" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="230" y="204" text-anchor="middle" fill="#10b981" font-size="10" font-weight="bold">3</text>
  <line x1="242" y1="200" x2="285" y2="200" stroke="#10b981" stroke-width="1"/>
  <!-- Arrow path between steps -->
  <path d="M230 132 L230 148" stroke="#10b981" stroke-width="1" fill="none" marker-end="none"/>
  <path d="M230 172 L230 188" stroke="#10b981" stroke-width="1" fill="none"/>
  <!-- Bookmark ribbon -->
  <path d="M310 90 L310 130 L305 120 L300 130 L300 90" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <!-- Compass/navigation rose above -->
  <circle cx="200" cy="50" r="18" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <line x1="200" y1="35" x2="200" y2="65" stroke="#10b981" stroke-width="1"/>
  <line x1="185" y1="50" x2="215" y2="50" stroke="#10b981" stroke-width="1"/>
  <!-- Mountain peaks at base -->
  <path d="M50 390 L90 355 L130 390" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
  <path d="M270 390 L310 355 L350 390" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
</svg>
