<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="studioGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1a1028" stop-opacity="1"/>
      <stop offset="50%" stop-color="#2d1b4e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3d2663" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1920" height="1080" fill="url(#studioGrad)"/>
  
  <!-- Mountains silhouette -->
  <path d="M0 900 L200 600 L400 750 L600 500 L850 700 L1100 450 L1350 650 L1500 550 L1700 700 L1920 580 L1920 1080 L0 1080 Z" fill="#0d0814" opacity="0.9"/>
  
  <!-- Film reel left -->
  <g transform="translate(150, 650)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1a1028" stroke-width="20"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#2d1b4e" stroke-width="8"/>
    <circle cx="0" cy="0" r="30" fill="#1a1028"/>
    <!-- Sprocket holes -->
    <circle cx="0" cy="-70" r="15" fill="#0d0814"/>
    <circle cx="60" cy="-35" r="15" fill="#0d0814"/>
    <circle cx="60" cy="35" r="15" fill="#0d0814"/>
    <circle cx="0" cy="70" r="15" fill="#0d0814"/>
    <circle cx="-60" cy="35" r="15" fill="#0d0814"/>
    <circle cx="-60" cy="-35" r="15" fill="#0d0814"/>
  </g>
  
  <!-- Film reel right -->
  <g transform="translate(1770, 680)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#1a1028" stroke-width="16"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#2d1b4e" stroke-width="6"/>
    <circle cx="0" cy="0" r="25" fill="#1a1028"/>
    <circle cx="0" cy="-55" r="12" fill="#0d0814"/>
    <circle cx="48" cy="-28" r="12" fill="#0d0814"/>
    <circle cx="48" cy="28" r="12" fill="#0d0814"/>
    <circle cx="0" cy="55" r="12" fill="#0d0814"/>
    <circle cx="-48" cy="28" r="12" fill="#0d0814"/>
    <circle cx="-48" cy="-28" r="12" fill="#0d0814"/>
  </g>
  
  <!-- Clapperboard -->
  <g transform="translate(900, 520) rotate(-10)">
    <rect x="-100" y="0" width="200" height="120" fill="#1a1028" rx="5"/>
    <rect x="-100" y="-30" width="200" height="35" fill="#2d1b4e" rx="5"/>
    <!-- Stripes on clapper -->
    <rect x="-90" y="-25" width="25" height="25" fill="#0d0814" transform="skewX(-10)"/>
    <rect x="-40" y="-25" width="25" height="25" fill="#0d0814" transform="skewX(-10)"/>
    <rect x="10" y="-25" width="25" height="25" fill="#0d0814" transform="skewX(-10)"/>
    <rect x="60" y="-25" width="25" height="25" fill="#0d0814" transform="skewX(-10)"/>
  </g>
  
  <!-- Film strip connecting reels -->
  <path d="M270 650 Q500 600 750 620 Q1000 640 1250 600 Q1500 560 1670 680" 
        fill="none" stroke="#1a1028" stroke-width="30" opacity="0.7"/>
  
  <!-- Speech bubbles (for chat/manga modes) -->
  <g transform="translate(500, 400)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="80" ry="50" fill="#2d1b4e"/>
    <polygon points="-20,45 0,70 20,45" fill="#2d1b4e"/>
  </g>
  
  <g transform="translate(700, 350)" opacity="0.3">
    <ellipse cx="0" cy="0" rx="60" ry="35" fill="#3d2663"/>
    <polygon points="10,30 25,50 35,30" fill="#3d2663"/>
  </g>
  
  <!-- Manga panel frames -->
  <g transform="translate(1300, 400)" opacity="0.35">
    <rect x="0" y="0" width="150" height="100" fill="none" stroke="#2d1b4e" stroke-width="4"/>
    <rect x="160" y="0" width="100" height="45" fill="none" stroke="#2d1b4e" stroke-width="4"/>
    <rect x="160" y="55" width="100" height="45" fill="none" stroke="#2d1b4e" stroke-width="4"/>
  </g>
  
  <!-- Stars -->
  <circle cx="300" cy="200" r="2" fill="#a78bfa" opacity="0.6"/>
  <circle cx="800" cy="150" r="2" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="1200" cy="180" r="2" fill="#a78bfa" opacity="0.7"/>
  <circle cx="1600" cy="220" r="2" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="450" cy="280" r="1.5" fill="#a78bfa" opacity="0.4"/>
  <circle cx="1000" cy="250" r="1.5" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="1450" cy="300" r="1.5" fill="#a78bfa" opacity="0.4"/>
</svg>
