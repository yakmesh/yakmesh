<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a8a6a" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#3d6a5a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#101a16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- MOUNTAIN BACKDROP -->
  <polygon points="0,650 200,350 400,600 400,1080 0,1080" fill="#1a2a22" opacity="0.35"/>
  <polygon points="300,680 500,380 700,620 700,1080 300,1080" fill="#1a2a22" opacity="0.4"/>
  <polygon points="1300,660 1500,360 1700,600 1700,1080 1300,1080" fill="#1a2a22" opacity="0.4"/>
  <polygon points="1600,680 1800,420 1920,650 1920,1080 1600,1080" fill="#1a2a22" opacity="0.35"/>
  
  <!-- GIANT CLOCK FACE - center -->
  <circle cx="960" cy="500" r="380" fill="#0a120e" opacity="0.8"/>
  <circle cx="960" cy="500" r="380" stroke="#2e4c43" stroke-width="4" fill="none" opacity="0.5"/>
  <circle cx="960" cy="500" r="360" stroke="#1f332d" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Clock glow -->
  <circle cx="960" cy="500" r="400" fill="url(#clockGlow)"/>
  
  <!-- Clock hour markers -->
  <line x1="960" y1="140" x2="960" y2="180" stroke="#3d6a5a" stroke-width="4" opacity="0.5"/>
  <line x1="960" y1="820" x2="960" y2="860" stroke="#3d6a5a" stroke-width="4" opacity="0.5"/>
  <line x1="600" y1="500" x2="640" y2="500" stroke="#3d6a5a" stroke-width="4" opacity="0.5"/>
  <line x1="1280" y1="500" x2="1320" y2="500" stroke="#3d6a5a" stroke-width="4" opacity="0.5"/>
  
  <!-- Minor hour markers -->
  <circle cx="1120" cy="222" r="5" fill="#2e4c43" opacity="0.4"/>
  <circle cx="1238" cy="340" r="5" fill="#2e4c43" opacity="0.4"/>
  <circle cx="1238" cy="660" r="5" fill="#2e4c43" opacity="0.4"/>
  <circle cx="1120" cy="778" r="5" fill="#2e4c43" opacity="0.4"/>
  <circle cx="800" cy="778" r="5" fill="#2e4c43" opacity="0.4"/>
  <circle cx="682" cy="660" r="5" fill="#2e4c43" opacity="0.4"/>
  <circle cx="682" cy="340" r="5" fill="#2e4c43" opacity="0.4"/>
  <circle cx="800" cy="222" r="5" fill="#2e4c43" opacity="0.4"/>
  
  <!-- Clock hands - frozen at high precision moment -->
  <!-- Hour hand -->
  <line x1="960" y1="500" x2="960" y2="280" stroke="#3d6a5a" stroke-width="8" opacity="0.5"/>
  <!-- Minute hand -->
  <line x1="960" y1="500" x2="1150" y2="380" stroke="#4a8a6a" stroke-width="5" opacity="0.5"/>
  <!-- Second hand - ultra thin, precision -->
  <line x1="960" y1="500" x2="780" y2="340" stroke="#5a9a7a" stroke-width="2" opacity="0.6"/>
  
  <!-- Center hub -->
  <circle cx="960" cy="500" r="15" fill="#4a8a6a" opacity="0.5"/>
  
  <!-- ATOMIC ORBITS around the clock -->
  <ellipse cx="960" cy="500" rx="450" ry="150" stroke="#3d6a5a" stroke-width="1.5" fill="none" opacity="0.25" transform="rotate(-30, 960, 500)"/>
  <ellipse cx="960" cy="500" rx="480" ry="160" stroke="#3d6a5a" stroke-width="1.5" fill="none" opacity="0.2" transform="rotate(30, 960, 500)"/>
  <ellipse cx="960" cy="500" rx="420" ry="140" stroke="#2e4c43" stroke-width="1.5" fill="none" opacity="0.2" transform="rotate(90, 960, 500)"/>
  
  <!-- Electrons on orbits -->
  <circle cx="560" cy="380" r="8" fill="#4a8a6a" opacity="0.4"/>
  <circle cx="1380" cy="600" r="8" fill="#4a8a6a" opacity="0.4"/>
  <circle cx="960" cy="100" r="8" fill="#4a8a6a" opacity="0.35"/>
  
  <!-- GPS SATELLITES in corners -->
  <!-- Top left -->
  <circle cx="200" cy="150" r="6" fill="#4a8a6a" opacity="0.35"/>
  <line x1="200" y1="150" x2="700" y2="350" stroke="#3d6a5a" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
  
  <!-- Top right -->
  <circle cx="1700" cy="180" r="6" fill="#4a8a6a" opacity="0.35"/>
  <line x1="1700" y1="180" x2="1200" y2="380" stroke="#3d6a5a" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>
  
  <!-- Bottom left -->
  <circle cx="250" cy="750" r="6" fill="#4a8a6a" opacity="0.3"/>
  <line x1="250" y1="750" x2="650" y2="600" stroke="#3d6a5a" stroke-width="1" opacity="0.15" stroke-dasharray="5,5"/>
  
  <!-- Precision indicator -->
  <text x="960" y="680" fill="#4a8a6a" opacity="0.35" font-size="28" font-family="monospace" text-anchor="middle">±1ms</text>
  
  <!-- Stratum levels -->
  <text x="100" y="950" fill="#3d6a5a" opacity="0.2" font-size="20" font-family="monospace">Stratum 0 ← GPS/Atomic</text>
  <text x="100" y="980" fill="#2e4c43" opacity="0.15" font-size="18" font-family="monospace">Stratum 1 ← NTP Server</text>
  
  <!-- Ground -->
  <polygon points="0,920 300,900 600,940 900,910 1200,950 1500,920 1920,960 1920,1080 0,1080" fill="#101a16" opacity="0.75"/>
</svg>