<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <!-- Amber/gold gradient for bundle theme -->
    <linearGradient id="bundleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0"/>
      <stop offset="60%" stop-color="#451a03" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.95"/>
    </linearGradient>
    
    <linearGradient id="boxGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  
  <!-- Background gradient -->
  <rect width="100%" height="100%" fill="url(#bundleGradient)"/>
  
  <!-- Mountain silhouette base -->
  <path d="M0,950 L200,850 L350,890 L500,800 L650,860 L800,780 L950,840 L1100,750 L1250,820 L1400,760 L1550,830 L1700,770 L1850,850 L1920,800 L1920,1080 L0,1080 Z" 
        fill="#1a0a01" fill-opacity="0.8"/>
  
  <!-- Central package/bundle - main visual -->
  <g transform="translate(960, 650)" opacity="0.6">
    <!-- Box base - 3D perspective -->
    <path d="M-150,50 L0,120 L150,50 L150,-80 L0,-150 L-150,-80 Z" 
          fill="#451a03" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Box top -->
    <path d="M-150,-80 L0,-10 L150,-80 L0,-150 Z" 
          fill="#5c2308" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Box right side -->
    <path d="M0,-10 L150,-80 L150,50 L0,120 Z" 
          fill="#3d1803" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Box left side -->
    <path d="M-150,-80 L0,-10 L0,120 L-150,50 Z" 
          fill="#2d1202" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Ribbon/binding horizontal -->
    <path d="M-150,-15 L0,55 L150,-15" 
          fill="none" stroke="#fbbf24" stroke-width="4" stroke-opacity="0.6"/>
    <path d="M-150,15 L0,85 L150,15" 
          fill="none" stroke="#fbbf24" stroke-width="4" stroke-opacity="0.6"/>
    
    <!-- Ribbon bow on top -->
    <ellipse cx="0" cy="-80" rx="25" ry="15" fill="#fbbf24" fill-opacity="0.5"/>
    <path d="M-40,-80 Q-20,-110 0,-80 Q20,-110 40,-80" 
          fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.6"/>
    
    <!-- Hash verification symbol -->
    <text x="0" y="5" text-anchor="middle" fill="#fbbf24" fill-opacity="0.5" 
          font-family="monospace" font-size="24">#</text>
  </g>
  
  <!-- Left stack of documents -->
  <g transform="translate(400, 750)" opacity="0.5">
    <rect x="-80" y="-10" width="160" height="10" fill="#2d1202" rx="2"/>
    <rect x="-80" y="-25" width="160" height="12" fill="#3d1803" rx="2"/>
    <rect x="-80" y="-42" width="160" height="14" fill="#4d2104" rx="2"/>
    <rect x="-80" y="-62" width="160" height="17" fill="#5d2905" rx="2"/>
    <!-- Page lines -->
    <line x1="-60" y1="-55" x2="60" y2="-55" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="-60" y1="-50" x2="40" y2="-50" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
  </g>
  
  <!-- Right stack of documents -->
  <g transform="translate(1520, 750)" opacity="0.5">
    <rect x="-80" y="-10" width="160" height="10" fill="#2d1202" rx="2"/>
    <rect x="-80" y="-25" width="160" height="12" fill="#3d1803" rx="2"/>
    <rect x="-80" y="-42" width="160" height="14" fill="#4d2104" rx="2"/>
    <rect x="-80" y="-62" width="160" height="17" fill="#5d2905" rx="2"/>
    <!-- Page lines -->
    <line x1="-60" y1="-55" x2="60" y2="-55" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="-60" y1="-50" x2="40" y2="-50" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
  </g>
  
  <!-- Scattered hash symbols representing verification -->
  <g opacity="0.25" fill="#fbbf24" font-family="monospace" font-size="18">
    <text x="300" y="600">#a3f2</text>
    <text x="1600" y="580">#7e9b</text>
    <text x="500" y="700">#c4d1</text>
    <text x="1400" y="720">#89ab</text>
    <text x="250" y="850">#5f2e</text>
    <text x="1650" y="870">#12df</text>
  </g>
  
  <!-- Connection lines showing bundling -->
  <g stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4,4">
    <line x1="480" y1="700" x2="810" y2="650"/>
    <line x1="1440" y1="700" x2="1110" y2="650"/>
    <line x1="400" y1="800" x2="960" y2="770"/>
    <line x1="1520" y1="800" x2="960" y2="770"/>
  </g>
  
  <!-- Small floating yak silhouette -->
  <g transform="translate(150, 920)" opacity="0.4">
    <path d="M0,0 Q15,-20 30,-15 Q45,-10 50,0 Q55,-5 60,0 L55,15 Q45,20 30,18 Q15,20 5,15 Z" 
          fill="#2d1202"/>
    <!-- Horns -->
    <path d="M25,-15 Q20,-25 15,-30" fill="none" stroke="#2d1202" stroke-width="3"/>
    <path d="M35,-15 Q40,-25 45,-30" fill="none" stroke="#2d1202" stroke-width="3"/>
  </g>
  
  <!-- Another small yak on right -->
  <g transform="translate(1750, 900) scale(-1,1)" opacity="0.35">
    <path d="M0,0 Q15,-20 30,-15 Q45,-10 50,0 Q55,-5 60,0 L55,15 Q45,20 30,18 Q15,20 5,15 Z" 
          fill="#2d1202"/>
    <path d="M25,-15 Q20,-25 15,-30" fill="none" stroke="#2d1202" stroke-width="3"/>
    <path d="M35,-15 Q40,-25 45,-30" fill="none" stroke="#2d1202" stroke-width="3"/>
  </g>
</svg>